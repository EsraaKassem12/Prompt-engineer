<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Manager</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root { --ink: #20242a; --muted: #77756e; --line: #dfddd6; --paper: #f8f7f3; --white: #fffefa; --orange: #e6673c; --blue: #3856d5; --yellow: #f6d76d; --green: #d6eadc; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 14px 'DM Sans', sans-serif; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; border: 0; }
    .app { display: grid; grid-template-columns: 245px 1fr; min-height: 100vh; }
    aside { padding: 27px 20px; border-right: 1px solid var(--line); background: #f2f1ed; }
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 8px 43px; font: 700 18px 'Space Grotesk'; letter-spacing: -.5px; }
    .brand-copy { display: grid; gap: 2px; }
    .brand-owner { color: #918e84; font: 500 10px 'DM Sans'; letter-spacing: .2px; }
    .brand-mark { display: grid; place-items: center; width: 28px; height: 28px; color: #fff; background: var(--orange); border-radius: 8px; transform: rotate(-8deg); font-size: 16px; }
    .side-label { margin: 0 10px 12px; color: #9a978d; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .nav { display: grid; gap: 4px; margin-bottom: 31px; }
    .nav button, .collection { display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 11px; color: #5f5e59; background: transparent; border-radius: 7px; text-align: left; }
    .nav button:hover, .collection:hover, .nav .active { color: var(--ink); background: #e5e3dd; }
    .nav .active { font-weight: 700; }
    .nav-icon { width: 17px; color: #96948d; text-align: center; font-size: 16px; }
    .count { margin-left: auto; color: #a5a29a; font-size: 12px; }
    .collection .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--yellow); }
    .collection:nth-child(3) .dot { background: #a9c8ec; }
    .collection:nth-child(4) .dot { background: #c3b2dc; }
    .collection.add { color: #9a978d; border: 1px dashed #c9c6bc; justify-content: center; }
    main { max-width: 1280px; width: 100%; padding: 42px clamp(25px, 5vw, 72px) 70px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font: 700 clamp(27px, 3vw, 38px) 'Space Grotesk'; letter-spacing: -1.7px; }
    .subtitle { margin-top: 9px; color: var(--muted); }
    .primary { display: flex; align-items: center; gap: 8px; padding: 11px 16px; color: white; background: var(--ink); border-radius: 7px; font-weight: 700; box-shadow: 0 2px 0 #000; }
    .primary:hover { transform: translateY(-1px); background: var(--orange); }
    .toolbar { display: flex; gap: 12px; margin: 36px 0 28px; }
    .search { position: relative; flex: 1; }
    .search span { position: absolute; left: 14px; top: 11px; color: #99968c; font-size: 17px; }
    input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 7px; outline: 0; background: var(--white); color: var(--ink); }
    input:focus, textarea:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #3856d51c; }
    .search input { height: 42px; padding: 0 15px 0 42px; }
    .filter { width: 165px; height: 42px; padding: 0 12px; }
    .stats { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; color: var(--muted); font-size: 12px; }
    .stats strong { color: var(--ink); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .card { display: flex; min-height: 217px; flex-direction: column; padding: 21px; border: 1px solid var(--line); border-radius: 9px; background: var(--white); transition: border-color .2s, transform .2s, box-shadow .2s; }
    .card:hover { border-color: #b6b3ab; transform: translateY(-2px); box-shadow: 0 8px 20px #28261c0d; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .tag { display: inline-flex; padding: 5px 9px; border-radius: 4px; color: #4e492b; background: #f5e8ac; font-size: 11px; font-weight: 700; }
    .tag.blue { color: #34447e; background: #dce5fb; }
    .tag.green { color: #37614a; background: var(--green); }
    .tag.purple { color: #654d78; background: #e9def1; }
    .star { padding: 0 1px; color: #bdb9ae; background: transparent; font-size: 20px; line-height: 1; }
    .star.saved { color: #dfaa27; }
    .card h3 { margin: 18px 0 9px; font: 600 17px 'Space Grotesk'; letter-spacing: -.4px; }
    .card p { display: -webkit-box; overflow: hidden; color: var(--muted); line-height: 1.55; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 18px; color: #aaa69b; font-size: 11px; }
    .card-actions { display: flex; gap: 13px; }
    .text-button { padding: 0; color: var(--blue); background: transparent; font-size: 12px; font-weight: 700; }
    .empty { grid-column: 1 / -1; padding: 70px 20px; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 9px; }
    dialog { width: min(560px, calc(100% - 30px)); padding: 0; border: 0; border-radius: 10px; box-shadow: 0 20px 70px #17150f35; }
    dialog::backdrop { background: #25231d66; backdrop-filter: blur(2px); }
    .modal { padding: 27px; background: var(--white); }
    .modal-head { display: flex; justify-content: space-between; margin-bottom: 25px; }
    .modal h2 { font: 700 23px 'Space Grotesk'; letter-spacing: -.7px; }
    .close { color: var(--muted); background: transparent; font-size: 24px; }
    label { display: block; margin: 15px 0 7px; color: #69675f; font-size: 12px; font-weight: 700; }
    textarea { min-height: 145px; padding: 12px; resize: vertical; line-height: 1.5; }
    .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .secondary { padding: 10px 15px; color: #68665e; background: #ebe9e2; border-radius: 7px; font-weight: 700; }
    @media (max-width: 720px) { .app { grid-template-columns: 1fr; } aside { padding: 16px; border-right: 0; border-bottom: 1px solid var(--line); } .brand { margin: 0 4px 18px; } .nav { display: flex; overflow-x: auto; margin-bottom: 15px; } .nav button { width: auto; white-space: nowrap; } aside .side-label, .collections { display: none; } main { padding: 28px 18px 50px; } .topbar { flex-direction: column; } .toolbar { margin-top: 25px; } .filter { width: 130px; } }
    @media (max-width: 430px) { .toolbar { flex-direction: column; } .filter { width: 100%; } .modal-row { grid-template-columns: 1fr; gap: 0; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><span class="brand-mark">+</span><span class="brand-copy">Prompt Manager<span class="brand-owner">by Esraa Kassem</span></span></div>
      <p class="side-label">Workspace</p>
      <nav class="nav" aria-label="Workspace views">
        <button class="active" data-view="all"><span class="nav-icon">▦</span> All prompts <span class="count" id="allCount"></span></button>
        <button data-view="favorites"><span class="nav-icon">☆</span> Favorites <span class="count" id="favCount"></span></button>
      </nav>
      <div class="collections">
        <p class="side-label">Collections</p>
        <div id="categoryList"></div>
        <button class="collection add" id="addCollection">+ New collection</button>
      </div>
    </aside>
    <main>
      <header class="topbar"><div><h1>All prompts</h1><p class="subtitle">Your thinking, neatly organized.</p></div><button class="primary" id="newPrompt">+ New prompt</button></header>
      <div class="toolbar"><div class="search"><span>⌕</span><input id="search" type="search" placeholder="Search prompts..." aria-label="Search prompts"></div><select class="filter" id="filter" aria-label="Filter by category"><option value="all">All categories</option><option>Writing</option><option>Coding</option><option>Marketing</option></select></div>
      <div class="stats"><strong id="resultCount"></strong><span>prompts</span><span>·</span><span>Last updated today</span></div>
      <section class="cards" id="cards" aria-live="polite"></section>
    </main>
  </div>
  <dialog id="promptDialog"><form class="modal" id="promptForm"><div class="modal-head"><h2>New prompt</h2><button class="close" type="button" id="closeDialog" aria-label="Close">×</button></div><label for="title">Name</label><input id="title" required placeholder="e.g. Landing page ideas"><label for="content">Prompt</label><textarea id="content" required placeholder="Write your prompt here..."></textarea><div class="modal-row"><div><label for="category">Collection</label><select id="category"><option>Writing</option><option>Coding</option><option>Marketing</option></select></div><div><label for="newTag">Tag</label><input id="newTag" placeholder="e.g. Brainstorming"></div></div><div class="modal-actions"><button class="secondary" type="button" id="cancelDialog">Cancel</button><button class="primary" type="submit">Save prompt</button></div></form></dialog>
  <script>
    const prompts = [
      { title: 'Turn notes into an outline', content: 'Transform these raw notes into a clear, logical outline. Identify the main argument, supporting points, and any gaps worth exploring.', category: 'Writing', tag: 'Structure', color: '', favorite: true },
      { title: 'Explain like I\'m five', content: 'Explain the following complex concept in simple language using a relatable analogy. Avoid jargon, but keep the explanation accurate.', category: 'Writing', tag: 'Clarity', color: 'blue', favorite: false },
      { title: 'Refactor this function', content: 'Review this function for readability, performance, and edge cases. Suggest a refactored version and briefly explain each meaningful change.', category: 'Coding', tag: 'Development', color: 'green', favorite: true },
      { title: 'Find the bug', content: 'Inspect this code and identify the root cause of the bug. Show the smallest safe fix, then suggest one test that would catch it in the future.', category: 'Coding', tag: 'Debugging', color: 'green', favorite: false },
      { title: 'Content calendar starter', content: 'Create a practical 30-day content calendar for this brand. Balance educational, entertaining, and conversion-focused posts.', category: 'Marketing', tag: 'Planning', color: 'purple', favorite: false },
      { title: 'Five unexpected angles', content: 'Give me five fresh, non-obvious angles for this topic. For each one, include the audience insight that makes it interesting.', category: 'Marketing', tag: 'Ideation', color: 'purple', favorite: false },
      { title: 'Polish this draft', content: 'Improve the clarity and rhythm of this draft while preserving my voice. Call out any sentence where the meaning is ambiguous.', category: 'Writing', tag: 'Editing', color: '', favorite: false }
    ];
    const categories = ['Writing', 'Coding', 'Marketing'];
    const cards = document.querySelector('#cards');
    const search = document.querySelector('#search');
    const filter = document.querySelector('#filter');
    let view = 'all';
    function renderCategories() {
      document.querySelector('#categoryList').innerHTML = categories.map(category => `<button class="collection" data-category="${category}"><span class="dot"></span> ${category} <span class="count">${prompts.filter(prompt => prompt.category === category).length}</span></button>`).join('');
      filter.innerHTML = '<option value="all">All categories</option>' + categories.map(category => `<option>${category}</option>`).join('');
      const categorySelect = document.querySelector('#category');
      categorySelect.innerHTML = categories.map(category => `<option>${category}</option>`).join('');
      document.querySelectorAll('[data-category]').forEach(button => button.addEventListener('click', () => { filter.value = button.dataset.category; view = 'all'; document.querySelectorAll('[data-view]').forEach(item => item.classList.toggle('active', item.dataset.view === 'all')); document.querySelector('h1').textContent = button.dataset.category; render(); }));
    }
    function render() {
      const query = search.value.toLowerCase().trim();
      const selected = filter.value;
      const visible = prompts.filter(prompt => (view !== 'favorites' || prompt.favorite) && (selected === 'all' || prompt.category === selected) && (!query || `${prompt.title} ${prompt.content} ${prompt.tag}`.toLowerCase().includes(query)));
      document.querySelector('#resultCount').textContent = visible.length;
      document.querySelector('#allCount').textContent = prompts.length;
      document.querySelector('#favCount').textContent = prompts.filter(prompt => prompt.favorite).length;
      cards.innerHTML = visible.length ? visible.map(prompt => `<article class="card"><div class="card-top"><span class="tag ${prompt.color}">${prompt.tag}</span><button class="star ${prompt.favorite ? 'saved' : ''}" data-star="${prompts.indexOf(prompt)}" aria-label="${prompt.favorite ? 'Remove from favorites' : 'Add to favorites'}">${prompt.favorite ? '★' : '☆'}</button></div><h3>${prompt.title}</h3><p>${prompt.content}</p><div class="card-footer"><span>${prompt.category}</span><div class="card-actions"><button class="text-button" data-copy="${prompts.indexOf(prompt)}">Copy prompt</button></div></div></article>`).join('') : '<div class="empty">No prompts match your search.</div>';
    }
    cards.addEventListener('click', event => { const star = event.target.closest('[data-star]'); const copy = event.target.closest('[data-copy]'); if (star) { prompts[star.dataset.star].favorite = !prompts[star.dataset.star].favorite; render(); } if (copy) { navigator.clipboard.writeText(prompts[copy.dataset.copy].content); copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy prompt', 1200); } });
    search.addEventListener('input', render); filter.addEventListener('change', render);
    document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => { view = button.dataset.view; document.querySelectorAll('[data-view]').forEach(item => item.classList.remove('active')); button.classList.add('active'); document.querySelector('h1').textContent = view === 'favorites' ? 'Favorites' : 'All prompts'; render(); }));
    const dialog = document.querySelector('#promptDialog');
    document.querySelector('#newPrompt').addEventListener('click', () => dialog.showModal());
    document.querySelector('#closeDialog').addEventListener('click', () => dialog.close());
    document.querySelector('#cancelDialog').addEventListener('click', () => dialog.close());
    document.querySelector('#promptForm').addEventListener('submit', event => { event.preventDefault(); const title = document.querySelector('#title').value; prompts.unshift({ title, content: document.querySelector('#content').value, category: document.querySelector('#category').value, tag: document.querySelector('#newTag').value || 'New', color: '', favorite: false }); event.target.reset(); dialog.close(); filter.value = 'all'; view = 'all'; document.querySelector('h1').textContent = 'All prompts'; document.querySelectorAll('[data-view]').forEach(item => item.classList.toggle('active', item.dataset.view === 'all')); render(); });
    document.querySelector('#addCollection').addEventListener('click', () => { const name = prompt('Category name:'); if (!name) return; const category = name.trim(); if (!category || categories.some(item => item.toLowerCase() === category.toLowerCase())) return; categories.push(category); renderCategories(); filter.value = category; view = 'all'; document.querySelector('h1').textContent = category; render(); });
    renderCategories();
    render();
  </script>
</body>
</html>
